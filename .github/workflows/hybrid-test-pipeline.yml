name: Hybrid API & UI Test Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 00:00 SAST (UTC+2)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-hybrid-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create config.properties from GitHub Secrets
        run: |
          mkdir -p src/test/resources/config
          cat << EOF > src/test/resources/config/config.properties
          base.url=${{ secrets.BASE_URL }}
          user.email=${{ secrets.USER_EMAIL }}
          user.password=${{ secrets.USER_PASSWORD }}
          EOF

      - name: Run Hybrid API and UI Tests
        run: mvn clean test

      - name: Generate Allure HTML Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          keep_reports: 1

      - name: Fix Allure Report Permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER allure-report
          sudo chmod -R a+rX allure-report

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Send Test Report via Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Hybrid Automation Suite (${{ job.status }}) - ${{ github.repository }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: "GitHub Actions Hybrid Framework pipeline <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Hi Lerato,

            Your scheduled/triggered Hybrid API & UI Test Automation run has completed.

            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Status: ${{ job.status }}
            - Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        